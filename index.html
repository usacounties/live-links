<!doctype html><html lang="ur"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Canada</title><style>
:root{color-scheme:dark;--bg:#10161f;--card:#161e2a;--line:#2a3647;
  --fg:#e8eef6;--fg2:#a3b3c8;--fg3:#6e8098;--teal:#4cb3a4;--ink3:#1d2736}
@media (prefers-color-scheme:light){:root{color-scheme:light;
  --bg:#f3f6fa;--card:#fff;--line:#dce3ec;--fg:#16202c;--fg2:#4f6279;
  --fg3:#7b8a9e;--teal:#1d7a6d;--ink3:#eef2f7}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-variant-numeric:tabular-nums}
.wrap{max-width:54rem;margin:0 auto;padding:26px 18px 70px}
h1{font-size:24px;font-weight:600;margin:0 0 2px;letter-spacing:-.01em}
.sub{font-size:13px;color:var(--fg3);margin-bottom:22px}
.big{font-size:34px;font-weight:600;margin-right:7px}
button{font:inherit;font-size:13px;border-radius:8px;
  border:1px solid var(--line);background:var(--ink3);color:var(--fg);
  cursor:pointer;padding:7px 13px}
button:hover{border-color:var(--fg3)}
.bar{display:flex;gap:9px;margin-bottom:18px;flex-wrap:wrap}
.batch{margin-bottom:26px}
.bhead{display:flex;gap:10px;align-items:center;margin-bottom:9px}
.bhead b{font-size:15px;font-weight:600}
.bhead em{font-style:normal;font-size:12px;color:var(--fg3);margin-right:auto}
section{background:var(--card);border:1px solid var(--line);
  border-radius:12px;margin-bottom:10px;overflow:hidden}
h2{font-size:14px;font-weight:600;margin:0;padding:12px 15px;
  border-bottom:1px solid var(--line);display:flex;gap:12px;
  justify-content:space-between;align-items:center}
h2 em{font-style:normal;font-size:12px;color:var(--fg3);font-weight:500;
  margin-left:auto;margin-right:4px}
ul{list-style:none;margin:0;padding:0}
li{padding:7px 15px;border-top:1px solid var(--line);font-size:12.5px}
li:first-child{border-top:0}
/* Waqt li ke andar NAHI hai (batch ke sar par hai), is liye page se
   mouse se copy karo to sirf URL aate hain. Button se bhi sirf URL. */
a{color:var(--fg);text-decoration:none;word-break:break-all;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
a:hover{color:var(--teal);text-decoration:underline}
.empty{padding:22px 16px;color:var(--fg3);background:var(--card);
  border:1px dashed var(--line);border-radius:12px}
.foot{margin-top:22px;font-size:12px;color:var(--fg3)}
#gate{max-width:22rem;margin:16vh auto;padding:0 18px;text-align:center}
#gate h1{font-size:20px;margin-bottom:14px}
#gate input{width:100%;padding:11px 13px;font:inherit;border-radius:9px;
  border:1px solid var(--line);background:var(--card);color:var(--fg);
  text-align:center;margin-bottom:10px}
#gate button{width:100%;padding:11px}
#err{color:#d9697a;font-size:13px;min-height:1.3em;margin-top:9px}
</style></head>
<body>
<div id="gate">
  <h1>Canada</h1>
  <input id="pw" type="password" placeholder="password" autofocus>
  <button onclick="go()">Kholo</button>
  <div id="err"></div>
</div>
<script>

function esc(s){return String(s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));}

// Har BATCH ka ek hi waqt. Dekhne wale ki apni ghari aur apna waqt —
// bhai USA mein hai to usay apna waqt dikhega. AM/PM pakka: hour12 true,
// warna kuch locale 24-ghante wala dikhate hain.
function stamp(t){
  const d = new Date(t * 1000);
  const day = d.toLocaleDateString([], {day:'numeric', month:'short'});
  const clock = d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit', hour12:true});
  return day + ', ' + clock;
}
let DATA = null;
function copy(txt, btn){
  const old = btn.textContent;
  navigator.clipboard.writeText(txt).then(()=>{btn.textContent='Copy ho gaya';},
    ()=>{btn.textContent='nahi hua';});
  setTimeout(()=>{btn.textContent=old;}, 1600);
}
// Copy mein SIRF link — na naam, na number, na waqt.
function copyAll(btn){
  const all = [];
  DATA.batches.forEach(b => b.parts.forEach(p => p.urls.forEach(u => all.push(u))));
  copy(all.join("\n"), btn);
}
function copyPart(bi, pi, btn){ copy(DATA.batches[bi].parts[pi].urls.join("\n"), btn); }
function copyBatch(bi, btn){
  const all = [];
  DATA.batches[bi].parts.forEach(p => p.urls.forEach(u => all.push(u)));
  copy(all.join("\n"), btn);
}
function render(d){
  DATA = d;
  const total = d.batches.reduce((a,b)=>a+b.n,0);
  let h = '<div class="wrap"><h1>' + esc(d.title) + '</h1>'
    + '<div class="sub"><span class="big">' + total + '</span>naye sponsored &middot; '
    + d.batches.length + ' batch &middot; ' + esc(d.when) + '</div>'
    + '<div class="bar"><button onclick="copyAll(this)">Sab copy karo</button>'
    + '<button onclick="location.reload()">Nayi karo</button></div>';
  if (!total) { h += '<div class="empty">Abhi koi naya link nahi.</div>'; }
  else d.batches.forEach((b, bi) => {
    h += '<div class="batch"><div class="bhead"><b>' + stamp(b.t) + '</b>'
      + '<em>' + b.n + ' link</em>'
      + '<button onclick="copyBatch(' + bi + ',this)">Copy</button></div>';
    b.parts.forEach((p, pi) => {
      if (!p.urls.length) return;
      h += '<section><h2>' + esc(p.name) + '<em>' + p.urls.length + '</em>'
        + '<button onclick="copyPart(' + bi + ',' + pi + ',this)">Copy</button></h2><ul>'
        + p.urls.map(u => '<li><a href="' + esc(u) + '" target="_blank" '
            + 'rel="noopener">' + esc(u) + '</a></li>').join('')
        + '</ul></section>';
    });
    h += '</div>';
  });
  h += '<div class="foot">Har batch ka ek waqt = jab wo links chadhe &middot; '
    + 'sirf naye sponsored &middot; '
    + 'har batch apne upload ke ' + d.hours + ' ghante baad khud saaf '
    + 'ho jata hai &middot; page se copy karo to sirf URL aate hain</div></div>';
  document.body.innerHTML = h;
}

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function open_(pw){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2",
                                             false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64(SALT), iterations:200000, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const out = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(IV)},
                                          key, b64(CT));
  return JSON.parse(new TextDecoder().decode(out));
}

async function go(){
  const pw = document.getElementById("pw").value;
  const err = document.getElementById("err");
  err.textContent = "khol raha hai...";
  try {
    const d = await open_(pw);
    try { sessionStorage.setItem("pw", pw); } catch(e) {}
    render(d);
    // page khud nayi ho jati hai; password yaad rehta hai
    setTimeout(() => location.reload(), REFRESH * 1000);
  } catch(e) {
    err.textContent = "password ghalat hai";
  }
}

document.getElementById("pw").addEventListener("keydown",
  e => { if (e.key === "Enter") go(); });

// refresh ke baad dobara password na poochho
(async () => {
  let pw = null;
  try { pw = sessionStorage.getItem("pw"); } catch(e) {}
  if (!pw) return;
  try {
    render(await open_(pw));
    setTimeout(() => location.reload(), REFRESH * 1000);
  } catch(e) {
    try { sessionStorage.removeItem("pw"); } catch(x) {}
  }
})();
