<!doctype html>
<html lang="ur">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="60">
<meta name="robots" content="noindex, nofollow">
<title>Naye sponsored</title>
<style>
:root{color-scheme:dark;--bg:#10161f;--card:#161e2a;--line:#2a3647;
  --fg:#e8eef6;--fg2:#a3b3c8;--fg3:#6e8098;--teal:#4cb3a4}
@media (prefers-color-scheme:light){:root{color-scheme:light;
  --bg:#f3f6fa;--card:#fff;--line:#dce3ec;--fg:#16202c;--fg2:#4f6279;
  --fg3:#7b8a9e;--teal:#1d7a6d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-variant-numeric:tabular-nums}
.wrap{max-width:48rem;margin:0 auto;padding:26px 18px 70px}
h1{font-size:19px;font-weight:600;margin:0 0 4px}
.sub{font-size:13px;color:var(--fg3);margin-bottom:24px}
.big{font-size:34px;font-weight:600;line-height:1;margin-right:6px}
section{background:var(--card);border:1px solid var(--line);
  border-radius:12px;margin-bottom:16px;overflow:hidden}
h2{font-size:14px;font-weight:600;margin:0;padding:13px 16px;
  border-bottom:1px solid var(--line);display:flex;
  justify-content:space-between;align-items:center}
h2 span{font-size:12px;color:var(--fg3);font-weight:500}
ol{list-style:none;margin:0;padding:0}
li{display:flex;gap:12px;align-items:baseline;padding:9px 16px;
  border-top:1px solid var(--line);font-size:13.5px}
li:first-child{border-top:0}
time{color:var(--fg3);font-size:11.5px;min-width:5.2rem;flex:none}
a{color:var(--fg);text-decoration:none;word-break:break-word}
a:hover{color:var(--teal);text-decoration:underline}
.empty{padding:22px 16px;color:var(--fg3);background:var(--card);
  border:1px dashed var(--line);border-radius:12px}
.foot{margin-top:22px;font-size:12px;color:var(--fg3)}
</style>
</head>
<body><div class="wrap">
<h1><span class="big">0</span>naye sponsored</h1>
<div class="sub">aakhri baar 15 Nov 2026, 04:44:40 PM &middot; page har 60 second mein khud nayi ho jati hai</div>
<div class="empty">Abhi koi naya link nahi mila.</div>
<div class="foot">Waqt wahi hai jab link pehli baar mila &middot; sirf naye sponsored</div>
</div></body></html>
